<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="t">What happens when a player logs in</title>
  <desc id="d">Six steps between your game, the player's browser and Jiwe ID: the game opens the login page, the player signs in, Jiwe sends the browser back to the game's Redirect URI with a one-time code, and the plugin swaps that code for a player token.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="960" height="610" fill="#ffffff"/>

  <!-- actors -->
  <rect x="60" y="24" width="200" height="50" rx="10" fill="#f6f8fa" stroke="#1b1f24" stroke-width="1.5"/>
  <text x="160" y="55" font-size="16" font-weight="700" fill="#1b1f24" text-anchor="middle">Your game</text>
  <rect x="380" y="24" width="200" height="50" rx="10" fill="#f6f8fa" stroke="#1b1f24" stroke-width="1.5"/>
  <text x="480" y="55" font-size="16" font-weight="700" fill="#1b1f24" text-anchor="middle">Player's browser</text>
  <rect x="700" y="24" width="200" height="50" rx="10" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/>
  <text x="800" y="55" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">Jiwe ID</text>

  <!-- lifelines -->
  <line x1="160" y1="74" x2="160" y2="545" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="480" y1="74" x2="480" y2="545" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="800" y1="74" x2="800" y2="545" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 1 -->
  <circle cx="34" cy="126" r="13" fill="#1b1f24"/><text x="34" y="131" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="320" y="116" font-size="14" fill="#1b1f24" text-anchor="middle">You call Login. The login page opens.</text>
  <line x1="160" y1="126" x2="474" y2="126" stroke="#1b1f24" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 -->
  <circle cx="34" cy="186" r="13" fill="#1b1f24"/><text x="34" y="191" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="640" y="176" font-size="14" fill="#1b1f24" text-anchor="middle">The player signs in.</text>
  <line x1="480" y1="186" x2="794" y2="186" stroke="#1b1f24" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 -->
  <circle cx="34" cy="246" r="13" fill="#1b1f24"/><text x="34" y="251" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="640" y="236" font-size="14" fill="#1b1f24" text-anchor="middle">"Go back to the game" + a one-time code</text>
  <line x1="800" y1="246" x2="486" y2="246" stroke="#1b1f24" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 (the step that goes wrong) -->
  <circle cx="34" cy="306" r="13" fill="#c2410c"/><text x="34" y="311" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="320" y="296" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">The browser opens your Redirect URI.</text>
  <line x1="480" y1="306" x2="166" y2="306" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ao)"/>

  <rect x="180" y="322" width="600" height="92" rx="10" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/>
  <text x="198" y="346" font-size="13" font-weight="700" fill="#9a3412">This is where most setups fail.</text>
  <text x="198" y="366" font-size="13" fill="#1b1f24">The Redirect URI must be registered on your Jiwe app, character for character:</text>
  <text x="198" y="388" font-size="13" fill="#1b1f24">Windows, Mac, Linux, editor</text>
  <text x="420" y="388" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#1b1f24">http://127.0.0.1:53682/</text>
  <text x="198" y="406" font-size="13" fill="#1b1f24">Android</text>
  <text x="420" y="406" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#1b1f24">yourgame://oauth-callback</text>

  <!-- 5 -->
  <circle cx="34" cy="456" r="13" fill="#1b1f24"/><text x="34" y="461" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="330" y="432" width="300" height="20" fill="#ffffff"/>
  <text x="480" y="446" font-size="14" fill="#1b1f24" text-anchor="middle">The plugin swaps the code for a player token.</text>
  <line x1="160" y1="456" x2="794" y2="456" stroke="#1b1f24" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6 -->
  <circle cx="34" cy="516" r="13" fill="#1b1f24"/><text x="34" y="521" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="380" y="492" width="200" height="20" fill="#ffffff"/>
  <text x="480" y="506" font-size="14" fill="#1b1f24" text-anchor="middle">Player token</text>
  <line x1="800" y1="516" x2="166" y2="516" stroke="#1b1f24" stroke-width="2" marker-end="url(#a)"/>

  <!-- result -->
  <rect x="60" y="550" width="840" height="42" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="576" font-size="14" fill="#1b1f24" text-anchor="middle"><tspan font-weight="700">On Login Succeeded</tspan> fires in your game. Rewards, purchases and saves now work for this player.</text>
</svg>
