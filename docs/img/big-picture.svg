<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="t">The big picture</title>
  <desc id="d">Your Unreal game contains the Jiwe SDK plugin. The plugin logs players in at Jiwe ID using the Login keys, and makes reward and leaderboard calls to Jiwe Wallet using the Wallet keys.</desc>
  <defs>
    <marker id="arrowLogin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <marker id="arrowWallet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/></marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- Your game -->
  <rect x="30" y="40" width="340" height="350" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="72" font-size="18" font-weight="700" fill="#1b1f24">Your Unreal game</text>
  <text x="50" y="95" font-size="13" fill="#57606a">Blueprint nodes, C++ or console commands</text>

  <rect x="50" y="118" width="300" height="252" rx="10" fill="#ffffff" stroke="#1b1f24" stroke-width="1.5"/>
  <text x="68" y="146" font-size="15" font-weight="700" fill="#1b1f24">Jiwe SDK plugin</text>
  <text x="68" y="166" font-size="13" fill="#57606a">One object: the Jiwe Subsystem</text>

  <rect x="68" y="184" width="264" height="62" rx="8" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/>
  <text x="84" y="210" font-size="15" font-weight="700" fill="#9a3412">Login</text>
  <text x="84" y="230" font-size="13" fill="#57606a">Who is playing?</text>

  <line x1="200" y1="246" x2="200" y2="286" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <text x="212" y="271" font-size="12" fill="#57606a">player token</text>

  <rect x="68" y="290" width="264" height="62" rx="8" fill="#ecfbff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="84" y="316" font-size="15" font-weight="700" fill="#155e75">Wallet calls</text>
  <text x="84" y="336" font-size="13" fill="#57606a">XP, airtime, leaderboards, saves</text>

  <!-- Jiwe ID -->
  <rect x="640" y="160" width="290" height="110" rx="14" fill="#fff4ec" stroke="#c2410c" stroke-width="1.5"/>
  <text x="660" y="194" font-size="17" font-weight="700" fill="#9a3412">Jiwe ID</text>
  <text x="660" y="216" font-size="13" fill="#57606a">id.jiwe.io</text>
  <text x="660" y="244" font-size="13" fill="#1b1f24">The player signs in here, in a browser</text>

  <!-- Jiwe Wallet -->
  <rect x="640" y="286" width="290" height="104" rx="14" fill="#ecfbff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="660" y="320" font-size="17" font-weight="700" fill="#155e75">Jiwe Wallet</text>
  <text x="660" y="342" font-size="13" fill="#57606a">abacus.jiwe.io</text>
  <text x="660" y="368" font-size="13" fill="#1b1f24">Keeps score, pays rewards</text>

  <!-- Login arrow -->
  <line x1="332" y1="215" x2="636" y2="215" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowLogin)" marker-start="url(#arrowLogin)"/>
  <rect x="396" y="170" width="180" height="38" rx="6" fill="#ffffff"/>
  <text x="486" y="186" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">Login keys</text>
  <text x="486" y="204" font-size="12" fill="#57606a" text-anchor="middle">Client ID + API Secret</text>

  <!-- Wallet arrow -->
  <line x1="332" y1="330" x2="636" y2="330" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowWallet)" marker-start="url(#arrowWallet)"/>
  <rect x="396" y="285" width="180" height="38" rx="6" fill="#ffffff"/>
  <text x="486" y="301" font-size="14" font-weight="700" fill="#155e75" text-anchor="middle">Wallet keys</text>
  <text x="486" y="319" font-size="12" fill="#57606a" text-anchor="middle">API Username + API Key</text>
  <text x="486" y="352" font-size="12" fill="#57606a" text-anchor="middle">plus the player token for</text>
  <text x="486" y="368" font-size="12" fill="#57606a" text-anchor="middle">anything about one player</text>

  <text x="640" y="72" font-size="18" font-weight="700" fill="#1b1f24">Jiwe</text>
  <text x="640" y="95" font-size="13" fill="#57606a">Two services, two pairs of keys</text>
</svg>
